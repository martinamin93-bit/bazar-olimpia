<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazar Olímpia - Contato</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header>
        <h1>Bazar Olímpia</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Fale conosco</h2>
        <p>Mande sua dúvida ou pedido pelo formulário abaixo.</p>

        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="assunto">Assunto:</label>
            <select id="assunto" name="assunto">
                <option>Dúvida</option>
                <option>Pedido</option>
                <option>Troca</option>
            </select>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5"></textarea>

            <button type="submit">Enviar</button>
        </form>

        <section>
            <h2>Onde estamos</h2>
            <p>Rua Exemplo, 100 - Centro - Olímpia/SP</p>
            <p>Segunda a sábado, das 8h às 18h</p>
        </section>
    </main>

    <footer>
        <p>Bazar Olímpia - Olímpia/SP</p>
        <p>Site feito para a Situação de Aprendizagem 01</p>
    </footer>

</body>
</html>
